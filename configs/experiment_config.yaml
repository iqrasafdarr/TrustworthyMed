project_name: "TrustworthyMed"
experiment_name: "baseline_resnet50"

data:
  ham10000_metadata: "data/raw/ham10000/HAM10000_metadata.csv"
  ham10000_images: "data/raw/ham10000/images/"
  bcn20000_metadata: "data/raw/bcn20000/bcn20000_metadata.csv"
  bcn20000_images: "data/raw/bcn20000/images/"
  splits_file: "data/splits/ham10000_splits.csv"
  external_test_file: "data/splits/bcn20000_external_test.csv"

training:
  batch_size: 16
  num_epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  device: "cpu"
  seed: 42

model:
  name: "resnet50"
  num_classes: 7
  pretrained: true
  dropout: 0.5

uncertainty:
  method: "mc_dropout"
  mc_iterations: 10

logging:
  use_wandb: false
  wandb_project: "TrustworthyMed"
  save_dir: "results/"